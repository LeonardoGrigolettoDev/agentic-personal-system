# AI Agent OS - V1 local control plane (docs/ARCHITECTURE.md §24).
# Services talk by service name; nothing hardcodes localhost between containers.
# Profiles:
#   (none)         core: postgres, valkey, litellm, decision      - always on
#   agent          hermes + sandbox (Hermes' SSH terminal backend)  - always on once configured
#   media          whisper server + edge media worker (audio/video -> transcript -> summary -> KB)
#   bench          V1 test battery CLI (one-shot: make bench-run)
#   observability  self-hosted Langfuse v4 (clickhouse, minio, worker, web) - off on 16 GB
# Host services (not containers): Ollama (Vulkan on the 780M), reached via host.docker.internal.
# Windows (WSL2 + Docker Desktop): compose.wsl.yaml on top of this file (COMPOSE_FILE in .env, set by make env).
name: aios

x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "3" }

x-host-gw: &host-gw
  extra_hosts: ["host.docker.internal:host-gateway"]

networks:
  aios:
    ipam:
      config: [{ subnet: 172.30.0.0/24 }] # ufw allows only this subnet -> host Ollama :11434
  sandbox_net: # sandbox + its clients only (hermes, edge, bench): agent-run code never reaches Ollama/whisper/db
    ipam:
      config: [{ subnet: 172.30.1.0/24 }] # outside the ufw rule on purpose (workers/sandbox/README.md "Security")

volumes:
  pgdata: {}
  valkeydata: {}
  lf_ch_data: {}
  lf_minio: {}
  sandbox_hostkeys: {} # stable sandbox host key => Hermes' known_hosts stays valid across rebuilds
  edge_hf_cache: {} # pyannote models (diarize extra), downloaded once

x-lf-env: &lf-env
  NEXTAUTH_URL: http://localhost:3000
  DATABASE_URL: postgresql://langfuse:${LANGFUSE_DB_PASSWORD}@postgres:5432/langfuse?connection_limit=5
  SALT: ${LANGFUSE_SALT}
  ENCRYPTION_KEY: ${LANGFUSE_ENCRYPTION_KEY}
  TELEMETRY_ENABLED: "false"
  CLICKHOUSE_URL: http://clickhouse:8123
  CLICKHOUSE_MIGRATION_URL: clickhouse://clickhouse:9000
  CLICKHOUSE_USER: clickhouse
  CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
  CLICKHOUSE_CLUSTER_ENABLED: "false"
  CLICKHOUSE_MAX_OPEN_CONNECTIONS: "5"
  REDIS_CONNECTION_STRING: redis://:${REDIS_PASSWORD}@valkey:6379/2
  REDIS_KEY_PREFIX: "langfuse:"
  LANGFUSE_INGESTION_QUEUE_PROCESSING_CONCURRENCY: "4"
  LANGFUSE_TRACE_UPSERT_WORKER_CONCURRENCY: "4"
  LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
  LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
  LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: minio
  LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
  LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://minio:9000
  LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
  LANGFUSE_S3_EVENT_UPLOAD_PREFIX: events/
  LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse
  LANGFUSE_S3_MEDIA_UPLOAD_REGION: auto
  LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: minio
  LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
  LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://minio:9000
  LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"
  LANGFUSE_S3_MEDIA_UPLOAD_PREFIX: media/
  TZ: UTC

services:
  # ───────────────────────────── core ─────────────────────────────
  postgres:
    image: pgvector/pgvector:0.8.7-pg17-trixie # pg17: LiteLLM/Langfuse Prisma on pg18 unverified
    restart: unless-stopped
    shm_size: 256mb
    mem_limit: 1g
    memswap_limit: 1g
    logging: *logging
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${PG_SUPERUSER_PASSWORD:?run make env}
      POSTGRES_DB: postgres
      AIOS_DB_PASSWORD: ${AIOS_DB_PASSWORD:?run make env}
      AIOS_READER_PASSWORD: ${AIOS_READER_PASSWORD:?run make env}
      LITELLM_DB_PASSWORD: ${LITELLM_DB_PASSWORD:?run make env}
      LANGFUSE_DB_PASSWORD: ${LANGFUSE_DB_PASSWORD:?run make env}
      TZ: UTC
    command: >
      postgres -c shared_buffers=256MB -c effective_cache_size=768MB -c work_mem=8MB
      -c maintenance_work_mem=128MB -c max_connections=100 -c max_parallel_maintenance_workers=2
      -c random_page_cost=1.1 -c wal_compression=on -c timezone=UTC
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/docker/postgres/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # -h 127.0.0.1: the initdb temp server listens only on the socket, so this stays red until init is done
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports: ["127.0.0.1:${PG_HOST_PORT:-5432}:5432"] # host-side tools (ingest worker, psql); loopback only
    networks: [aios]

  valkey:
    image: valkey/valkey:9.1-alpine
    restart: unless-stopped
    mem_limit: 320m
    memswap_limit: 320m
    logging: *logging
    environment: { REDIS_PASSWORD: "${REDIS_PASSWORD:?run make env}" }
    command:
      - sh
      - -c
      - exec valkey-server --requirepass "$$REDIS_PASSWORD" --maxmemory 256mb --maxmemory-policy noeviction --appendonly yes
    volumes: [valkeydata:/data]
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      retries: 10
    networks: [aios]

  litellm:
    image: ghcr.io/berriai/litellm:v1.104.0
    restart: unless-stopped
    <<: *host-gw
    mem_limit: 1536m
    memswap_limit: 1536m
    logging: *logging
    # config.yaml is rendered from config.template.yaml by `make litellm-config` (only providers with keys)
    command: ["--config=/app/config.yaml", "--port=4000", "--num_workers=1", "--max_requests_before_restart=10000"]
    volumes: ["./config/litellm/config.yaml:/app/config.yaml:ro"]
    ports: ["127.0.0.1:4000:4000"]
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?run make env}
      LITELLM_SALT_KEY: ${LITELLM_SALT_KEY:?run make env}
      DATABASE_URL: postgresql://litellm:${LITELLM_DB_PASSWORD}@postgres:5432/litellm
      STORE_MODEL_IN_DB: "True"
      LITELLM_LOG: ERROR
      LITELLM_MODE: PRODUCTION
      REDIS_HOST: valkey
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      OLLAMA_API_BASE: http://host.docker.internal:11434
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      MOONSHOT_API_KEY: ${MOONSHOT_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_OTEL_HOST: ${LANGFUSE_HOST:-https://cloud.langfuse.com}
    depends_on:
      postgres: { condition: service_healthy }
      valkey: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness')\""]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 90s
    networks: [aios]

  decision:
    build: ./decision
    image: aios/decision:dev
    restart: unless-stopped
    <<: *host-gw # native Ollama /api/chat for logprobs
    mem_limit: 128m
    memswap_limit: 128m
    logging: *logging
    ports: ["127.0.0.1:8090:8080"]
    environment:
      PORT: "8080"
      DATABASE_URL: postgresql://aios:${AIOS_DB_PASSWORD}@postgres:5432/aios?pool_max_conns=5
      REDIS_ADDR: valkey:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_DB: "1"
      DECISION_API_KEY: ${DECISION_API_KEY:?run make env}
      DECISION_BACKENDS: ${DECISION_BACKENDS:-rules,local}
      DECISION_THRESHOLD: ${DECISION_THRESHOLD:-0.8}
      DECISION_LOCAL_MODE: ${DECISION_LOCAL_MODE:-logprobs}
      DECISION_RULES_FILE: /etc/decision/rules.yaml
      DECISION_REQUIRED_MIGRATION: "006_decision_ledger"
      DECISION_POLICY_FILE: /etc/aios/routing.yaml
      DECISION_AGENTS_DIR: /etc/aios/agents
      BUDGET_TZ: ${TZ:-America/Sao_Paulo}
      LITELLM_BASE_URL: http://litellm:4000
      LITELLM_API_KEY: ${DECISION_LITELLM_KEY:-}
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      OLLAMA_DECIDER_MODEL: ${OLLAMA_DECIDER_MODEL:-qwen3:4b-instruct-2507-q4_K_M}
      TYPESAFE_API_KEY: ${TYPESAFE_API_KEY:-}
      JEV_MODEL: ${JEV_MODEL:-jev-latest}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_DECISIONS_MODEL: ${OPENAI_DECISIONS_MODEL:-gpt-6-luna}
      HERMES_WEBHOOK_SECRET: ${HERMES_WEBHOOK_SECRET:?run make env}
      # approval/escalation notifications (optional): Telegram bot and/or ntfy topic URL
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      NTFY_URL: ${NTFY_URL:-}
    volumes:
      - ./config/decision/rules.yaml:/etc/decision/rules.yaml:ro
      - ./config/routing.yaml:/etc/aios/routing.yaml:ro
      - ./agents:/etc/aios/agents:ro
    depends_on:
      postgres: { condition: service_healthy }
      valkey: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "/decision", "-healthcheck"]
      interval: 15s
      retries: 3
      start_period: 10s
    networks: [aios]

  knowledge:
    build: ./workers/kb
    image: aios/knowledge:dev
    restart: unless-stopped
    mem_limit: 384m
    memswap_limit: 384m
    logging: *logging
    ports: ["127.0.0.1:8092:8080"]
    environment:
      KNOWLEDGE_API_KEY: ${KNOWLEDGE_API_KEY:?run make env}
      KNOWLEDGE_TENANTS: ${KNOWLEDGE_TENANTS:-nitro,pessoal,shared}
      KB_DATABASE_URL: postgresql://aios:${AIOS_DB_PASSWORD}@postgres:5432/aios
      KB_POOL_MAX: "4"
      LITELLM_BASE_URL: http://litellm:4000
      KB_LITELLM_KEY: ${KB_LITELLM_KEY:-}
      STORAGE_BACKEND: local
      STORAGE_LOCAL_ROOT: /data/storage
    volumes: ["./data/storage:/data/storage"]
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8080/healthz')"]
      interval: 15s
      retries: 3
      start_period: 20s
    networks: [aios]

  # ───────────────────────────── agent ─────────────────────────────
  hermes:
    image: nousresearch/hermes-agent:${HERMES_TAG:-v2026.9.24}
    profiles: ["agent"]
    restart: unless-stopped
    command: ["gateway", "run"] # never override the entrypoint (s6-overlay /init)
    mem_limit: 2g # chief gateway + one on-demand Kanban worker (kanban.max_in_progress: 1)
    memswap_limit: 2g
    cpus: 2.0
    logging: *logging
    ports:
      - "127.0.0.1:8642:8642" # OpenAI-compatible API = full terminal access; key required
    volumes:
      - ./data/hermes:/opt/data # HERMES_HOME: config, SOUL, profiles/, state.db, sessions, cron, kanban
      - ./skills:/opt/shared-skills:ro # skills.external_dirs - outside /opt/data on purpose
      - ./tools/hermes-plugin/aios:/opt/aios/plugins/aios:ro # linked into every profile by hermes-setup
      - ./config/hermes:/opt/aios/config:ro
      - ./agents:/opt/aios/agents:ro
      - ./workflows:/opt/aios/workflows:ro
      - ./infra/hermes:/opt/aios/bin:ro
      - ./data/sandbox/keys/id_ed25519:/opt/aios/ssh/id_ed25519:ro # make sandbox-keys
    environment:
      HERMES_UID: "1000"
      HERMES_GID: "1000"
      API_SERVER_ENABLED: "true"
      API_SERVER_HOST: "0.0.0.0"
      API_SERVER_PORT: "8642"
      API_SERVER_KEY: ${HERMES_API_KEY:?run make env}
      LITELLM_API_KEY: ${HERMES_LITELLM_KEY:-} # guarded by `make up`; never the master key
      HERMES_WEBHOOK_SECRET: ${HERMES_WEBHOOK_SECRET}
      HERMES_LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      HERMES_LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      HERMES_LANGFUSE_BASE_URL: ${LANGFUSE_HOST:-https://cloud.langfuse.com}
      # aios plugin -> Decision Service (routing/budget/escalation) and knowledge (context, MCP)
      AIOS_DECISION_URL: http://decision:8080
      DECISION_API_KEY: ${DECISION_API_KEY}
      AIOS_KNOWLEDGE_URL: http://knowledge:8080
      KNOWLEDGE_API_KEY: ${KNOWLEDGE_API_KEY}
      AIOS_AGENTS_DIR: /opt/aios/agents
      AIOS_DEFAULT_TENANT: ${AIOS_DEFAULT_TENANT:-}
      # per-tenant edge keys: the plugin hands a Kanban worker only its tenant's key (never the admin EDGE_API_KEY)
      EDGE_TENANT_KEYS: ${EDGE_TENANT_KEYS:-}
      AIOS_CRON_DELIVER: ${AIOS_CRON_DELIVER:-local}
      # /p/<profile>/ API keys, written by hermes-setup into data/hermes/profiles/<p>/.env (bench, integrations)
      HERMES_API_KEY_ENGINEERING: ${HERMES_API_KEY_ENGINEERING:-}
      HERMES_API_KEY_FINANCE: ${HERMES_API_KEY_FINANCE:-}
      HERMES_API_KEY_PROJECTS: ${HERMES_API_KEY_PROJECTS:-}
      HERMES_API_KEY_PERSONAL: ${HERMES_API_KEY_PERSONAL:-}
      HERMES_API_KEY_LEARNING: ${HERMES_API_KEY_LEARNING:-}
      # optional messaging (deny-by-default allowlist): cron delivery + chatting with the chief
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_ALLOWED_USERS: ${TELEGRAM_ALLOWED_USERS:-}
      # terminal backend = sandbox over SSH (also used by the plugin's pre_verify aios-check)
      TERMINAL_SSH_HOST: sandbox
      TERMINAL_SSH_USER: agent
      TERMINAL_SSH_PORT: "22"
      TERMINAL_SSH_KEY: /opt/aios/ssh/id_ed25519
      TZ: ${TZ:-America/Sao_Paulo}
    depends_on:
      litellm: { condition: service_healthy }
      decision: { condition: service_healthy }
      knowledge: { condition: service_healthy }
      sandbox: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "/opt/hermes/.venv/bin/python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8642/health')"]
      interval: 30s
      start_period: 90s
      retries: 3
    networks: [aios, sandbox_net]

  sandbox: # isolated execution for Hermes' terminal backend (ssh agent@sandbox:22) - docs/CONTRACTS.md §6
    build: ./workers/sandbox
    image: aios/sandbox:dev
    profiles: ["agent"]
    hostname: sandbox
    restart: unless-stopped
    mem_limit: 2g
    memswap_limit: 2g # = mem_limit: no swap, so the tmpfs-held GITHUB_TOKEN never reaches disk
    pids_limit: 512
    cpus: 2.0
    logging: *logging
    # sshd privilege separation needs exactly these (OpenSSH 10.0p1 / Debian trixie; rationale per capability in
    # workers/sandbox/README.md "Security"). No DAC_OVERRIDE/FOWNER, no NET_BIND_SERVICE (see sysctls).
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID, SYS_CHROOT, AUDIT_WRITE, KILL]
    security_opt: ["no-new-privileges:true"]
    sysctls:
      net.ipv4.ip_unprivileged_port_start: "0" # sshd binds :22 without NET_BIND_SERVICE
    tmpfs:
      - /run/aios:rw,noexec,nosuid,nodev,size=1m,mode=0711 # GITHUB_TOKEN file for the git credential helper
    environment:
      AIOS_CHECK_TIMEOUT: ${SANDBOX_CHECK_TIMEOUT:-570} # plugin's aios-check: below its ssh timeout (600)
      AIOS_TASK_CHECK_TIMEOUT: ${SANDBOX_TASK_CHECK_TIMEOUT:-280} # agent's aios-task-check: below terminal.timeout (300)
      AIOS_CLONE_TIMEOUT: ${SANDBOX_CLONE_TIMEOUT:-900}
      GITHUB_TOKEN: ${SANDBOX_GITHUB_TOKEN:-} # optional, fine-grained and repo-scoped: the agent can read it
      TZ: ${TZ:-America/Sao_Paulo}
    volumes:
      - ./data/sandbox/workspace:/workspace
      - sandbox_hostkeys:/etc/ssh/keys
      - type: bind
        source: ./data/sandbox/keys/authorized_keys # make sandbox-keys
        target: /opt/aios/ssh/authorized_keys
        read_only: true
        bind: { create_host_path: false }
    # no ports, never /var/run/docker.sock; only on sandbox_net (not aios: Ollama/whisper there are unauthenticated)
    healthcheck:
      test: ["CMD", "/usr/local/bin/aios-healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks: [sandbox_net]

  # ───────────────────────────── media ─────────────────────────────
  whisper:
    image: ${WHISPER_IMAGE:-ghcr.io/ggml-org/whisper.cpp:main-vulkan} # CPU image (:main) on WSL2, see compose.wsl.yaml
    profiles: ["media"]
    restart: unless-stopped
    user: "1000:1000"
    group_add: ["${RENDER_GID:-992}"] # host 'render' group -> /dev/dri access
    devices: ["/dev/dri:/dev/dri"]
    mem_limit: 2g
    logging: *logging
    volumes:
      - ./data/whisper-models:/models:ro
      - ./knowledge/inbox:/audio
    # resident server for edge (make edge-up); --tmp-dir: as uid 1000 the image's default (/app) is not writable
    # entrypoint set explicitly: the CPU image (:main) has ENTRYPOINT ["bash","-c"], the Vulkan one has none
    entrypoint: ["whisper-server"]
    command: ["--host", "0.0.0.0", "--port", "8080", "-m", "/models/ggml-large-v3-turbo-q5_0.bin",
              "-l", "pt", "--convert", "--tmp-dir", "/tmp"]
    ports: ["127.0.0.1:8178:8080"]
    healthcheck: # the image ships curl; /health is 503 while the model loads
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 30s
      start_period: 60s
    networks: [aios]

  edge: # agent-edge media worker (CONTRACTS §5, ARCHITECTURE §22-23): upload -> ffmpeg -> whisper -> summary -> KB
    build: ./workers/edge # add `args: { EDGE_EXTRAS: diarize }` for pyannote diarization (+~1.3 GB, needs HF_TOKEN)
    image: aios/edge:dev
    profiles: ["media"]
    restart: unless-stopped
    user: "1000:1000" # owner of ./data/storage on the host
    mem_limit: 768m # raise to ~3g with the diarize extra
    memswap_limit: 768m
    # ffmpeg parses untrusted media (forwarded audio, downloaded videos): small blast radius, read-only root
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=64m # HOME=/tmp in the image
    pids_limit: 256 # threads count: anyio pool + job workers + ffmpeg (+ torch when diarizing)
    stop_grace_period: 30s # > uvicorn's 20 s graceful shutdown; in-memory jobs still running are abandoned
    logging: *logging
    ports: ["127.0.0.1:8093:8080"]
    environment:
      EDGE_API_KEY: ${EDGE_API_KEY:?run make env} # admin key: host only (make edge-*), never given to agents
      EDGE_TENANT_KEYS: ${EDGE_TENANT_KEYS:-} # tenant:key,... - what agent sessions get (workers/edge/README.md)
      STORAGE_BACKEND: local
      STORAGE_LOCAL_ROOT: /data/storage
      EDGE_MAX_UPLOAD_MB: ${EDGE_MAX_UPLOAD_MB:-2048}
      WHISPER_URL: http://whisper:8080
      EDGE_WHISPER_CHUNK_SECONDS: ${EDGE_WHISPER_CHUNK_SECONDS:-600}
      LITELLM_BASE_URL: http://litellm:4000
      EDGE_LITELLM_KEY: ${EDGE_LITELLM_KEY:-}
      EDGE_SUMMARY_MODEL: ${EDGE_SUMMARY_MODEL:-local-qwen}
      EDGE_FALLBACK_MODEL: ${EDGE_FALLBACK_MODEL:-tier2-cheap}
      EDGE_EMBED_MODEL: ${EDGE_EMBED_MODEL:-embed-local}
      KNOWLEDGE_URL: http://knowledge:8080
      KNOWLEDGE_API_KEY: ${KNOWLEDGE_API_KEY:?run make env}
      KNOWLEDGE_TENANTS: ${KNOWLEDGE_TENANTS:-nitro,pessoal,shared}
      MEDIA_RETENTION_DAYS: ${MEDIA_RETENTION_DAYS:-30}
      EDGE_MAINTAIN_INTERVAL_HOURS: ${EDGE_MAINTAIN_INTERVAL_HOURS:-24}
      EDGE_JOB_WORKERS: ${EDGE_JOB_WORKERS:-1}
      HF_TOKEN: ${HF_TOKEN:-}
      TZ: ${TZ:-America/Sao_Paulo}
    volumes:
      - ./data/storage:/data/storage
      - edge_hf_cache:/data/hf-cache # HF_HOME
    depends_on:
      whisper: { condition: service_healthy }
      knowledge: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8080/healthz')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks: [aios, sandbox_net] # sandbox_net: transcript_to_notes calls http://edge:8080 from the sandbox

  # ───────────────────────────── bench ─────────────────────────────
  bench: # V1 test battery (docs/CONTRACTS.md §7): make bench-run = docker compose --profile agent --profile bench run --rm bench run ...
    build: ./bench
    image: aios/bench:dev
    profiles: ["bench"]
    user: "1000:1000" # owner of data/sandbox/keys/id_ed25519 (0600)
    mem_limit: 256m
    memswap_limit: 256m
    cap_drop: [ALL] # holds the sandbox key, DECISION/HERMES keys and the DB password: no privileges, read-only root
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m # BENCH_SSH_KNOWN_HOSTS
    pids_limit: 128
    logging: *logging
    environment:
      AIOS_HERMES_URL: http://hermes:8642
      HERMES_API_KEY: ${HERMES_API_KEY:?run make env}
      HERMES_API_KEY_ENGINEERING: ${HERMES_API_KEY_ENGINEERING:-}
      HERMES_API_KEY_FINANCE: ${HERMES_API_KEY_FINANCE:-}
      HERMES_API_KEY_PROJECTS: ${HERMES_API_KEY_PROJECTS:-}
      HERMES_API_KEY_PERSONAL: ${HERMES_API_KEY_PERSONAL:-}
      HERMES_API_KEY_LEARNING: ${HERMES_API_KEY_LEARNING:-}
      AIOS_DECISION_URL: http://decision:8080
      DECISION_API_KEY: ${DECISION_API_KEY:?run make env}
      BENCH_DATABASE_URL: postgresql://aios:${AIOS_DB_PASSWORD:?run make env}@postgres:5432/aios
      LITELLM_BASE_URL: http://litellm:4000
      BENCH_LITELLM_KEY: ${BENCH_LITELLM_KEY:-} # llm_judge checks; without it those tasks are recorded as errors
      BENCH_JUDGE_MODEL: ${BENCH_JUDGE_MODEL:-tier5-sonnet}
      BENCH_TASK_TIMEOUT: ${BENCH_TASK_TIMEOUT:-900}
      BENCH_WORKSPACE: /workspace/bench # inside the sandbox
      TERMINAL_SSH_HOST: sandbox
      TERMINAL_SSH_USER: agent
      TERMINAL_SSH_PORT: "22"
      TERMINAL_SSH_KEY: /opt/aios/ssh/id_ed25519
      BENCH_SSH_KNOWN_HOSTS: /tmp/bench_known_hosts
      AIOS_ROUTING_FILE: /opt/aios/config/routing.yaml
      AIOS_AGENTS_DIR: /opt/aios/agents
      BENCH_ENV_FILE: /nonexistent # configuration comes only from this environment
      TZ: ${TZ:-America/Sao_Paulo}
    volumes:
      - ./bench/tasks:/opt/aios/bench/tasks:ro
      - ./bench/fixtures:/opt/aios/bench/fixtures:ro # includes media generated by `make bench-fixtures`
      - ./config/routing.yaml:/opt/aios/config/routing.yaml:ro
      - ./agents:/opt/aios/agents:ro
      - ./data/sandbox/keys/id_ed25519:/opt/aios/ssh/id_ed25519:ro
    depends_on:
      postgres: { condition: service_healthy }
      decision: { condition: service_healthy }
      litellm: { condition: service_healthy }
      hermes: { condition: service_healthy }
      sandbox: { condition: service_healthy }
    networks: [aios, sandbox_net] # sandbox_net: command checks over ssh agent@sandbox

  # ───────────────────── observability (Langfuse v4) ─────────────────────
  clickhouse:
    image: clickhouse/clickhouse-server:26.4
    profiles: ["observability"]
    restart: unless-stopped
    user: "101:101"
    mem_limit: 1536m
    logging: *logging
    environment: { CLICKHOUSE_DB: default, CLICKHOUSE_USER: clickhouse, CLICKHOUSE_PASSWORD: "${CLICKHOUSE_PASSWORD}", TZ: UTC }
    volumes:
      - lf_ch_data:/var/lib/clickhouse
      - ./infra/docker/clickhouse/low-mem.xml:/etc/clickhouse-server/config.d/low-mem.xml:ro
      - ./infra/docker/clickhouse/low-mem-users.xml:/etc/clickhouse-server/users.d/low-mem-users.xml:ro
    healthcheck: { test: "wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1", interval: 5s, retries: 20 }
    networks: [aios]

  minio:
    image: cgr.dev/chainguard/minio
    profiles: ["observability"]
    restart: unless-stopped
    entrypoint: sh
    command: -c 'mkdir -p /data/langfuse && minio server --address ":9000" --console-address ":9001" /data'
    environment: { MINIO_ROOT_USER: minio, MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD}" }
    ports: ["127.0.0.1:9090:9000"]
    mem_limit: 256m
    logging: *logging
    volumes: [lf_minio:/data]
    networks: [aios]

  langfuse-worker:
    image: docker.langfuse.com/langfuse/langfuse-worker:${LANGFUSE_TAG:-4.54.0}
    profiles: ["observability"]
    restart: unless-stopped
    mem_limit: 768m
    logging: *logging
    environment: { <<: *lf-env, NODE_OPTIONS: "--max-old-space-size=512" }
    depends_on:
      postgres: { condition: service_healthy }
      valkey: { condition: service_healthy }
      clickhouse: { condition: service_healthy }
      minio: { condition: service_started }
    networks: [aios]

  langfuse-web:
    image: docker.langfuse.com/langfuse/langfuse:${LANGFUSE_TAG:-4.54.0}
    profiles: ["observability"]
    restart: unless-stopped
    mem_limit: 1g
    logging: *logging
    ports: ["127.0.0.1:3000:3000"]
    environment:
      <<: *lf-env
      NODE_OPTIONS: "--max-old-space-size=768"
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://localhost:9090
      LANGFUSE_S3_MEDIA_UPLOAD_INTERNAL_ENDPOINT: http://minio:9000
      AUTH_DISABLE_SIGNUP: "true"
      LANGFUSE_INIT_ORG_ID: aios
      LANGFUSE_INIT_ORG_NAME: AIOS
      LANGFUSE_INIT_PROJECT_ID: aios-dev
      LANGFUSE_INIT_PROJECT_NAME: aios-dev
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LANGFUSE_INIT_PROJECT_PUBLIC_KEY}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LANGFUSE_INIT_PROJECT_SECRET_KEY}
      LANGFUSE_INIT_USER_EMAIL: ${LANGFUSE_ADMIN_EMAIL}
      LANGFUSE_INIT_USER_NAME: admin
      LANGFUSE_INIT_USER_PASSWORD: ${LANGFUSE_ADMIN_PASSWORD}
    depends_on: [langfuse-worker]
    networks: [aios]
