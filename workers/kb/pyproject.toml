[project]
name = "kb"
version = "0.1.0"
description = "AIOS knowledge-base worker: ingest notes/files into Postgres (pgvector + Portuguese FTS) and run hybrid search"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "pypdf>=5.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "mcp>=1.9",
    "psycopg-pool>=3.2",
]

[project.scripts]
kb = "kb.cli:main"

[project.optional-dependencies]
s3 = [
    "boto3>=1.34",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "respx>=0.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kb"]

[tool.pytest.ini_options]
testpaths = ["tests"]
