key: simple-regex-cpf
category: simple
title: Regex RE2 para CPF formatado
tenant: pessoal
expected_task_type: implementation
expected_domain: engineering
tags: [regex, go]
prompt: |
  Escreva uma expressão regular compatível com RE2 (Go regexp) que aceite apenas CPF no formato
  000.000.000-00 (string inteira, sem espaços). Não precisa validar dígitos verificadores. Responda com a
  regex numa linha, entre crases.
check:
  type: regex
  pattern: '\^(\\d|\[0-9\])\{3\}\\\.(\\d|\[0-9\])\{3\}\\\.(\\d|\[0-9\])\{3\}(-|\\-)(\\d|\[0-9\])\{2\}\$|\^\((\?:)?(\\d|\[0-9\])\{3\}\\\.\)\{2\}(\\d|\[0-9\])\{3\}(-|\\-)(\\d|\[0-9\])\{2\}\$'
