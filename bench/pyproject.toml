[project]
name = "bench"
version = "0.1.0"
description = "AIOS V1 test battery: submit real tasks to Hermes, check them, record cost per successful task (§24.18, §14)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pyyaml>=6.0",
    "jsonschema>=4.23",
    "psycopg[binary]>=3.2",
]

[project.scripts]
bench = "bench.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["solutions"]
markers = [
    "toolchain: needs go/node/python3/git on PATH to run fixture checks",
    "integration: needs BENCH_TEST_DATABASE_URL",
]
