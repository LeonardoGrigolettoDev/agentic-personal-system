simple-actually-atualmente:
  pass:
    - >-
      "Actually" significa "na verdade" ou "de fato"; "atualmente" em inglês é "currently" ou "nowadays".
      Exemplo: "Actually, I prefer Go." / "I'm currently working at Nitro."
  fail:
    - "Actually significa atualmente. Exemplo: Actually I live in São Paulo."

