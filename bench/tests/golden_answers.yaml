    - "Fixed discount calculation for expired coupons."

simple-regex-cpf:
  pass:
    - "`^\\d{3}\\.\\d{3}\\.\\d{3}-\\d{2}$`"
    - "`^[0-9]{3}\\.[0-9]{3}\\.[0-9]{3}-[0-9]{2}$`"
    - "`^(?:\\d{3}\\.){2}\\d{3}-\\d{2}$`"
