    - "`^\\d{11}$`"

simple-sql-top-clientes:
  pass:
    - |
      ```sql
      SELECT c.nome, SUM(p.total) AS total
      FROM clientes c
      JOIN pedidos p ON p.cliente_id = c.id
      WHERE p.status = 'pago'
        AND p.criado_em >= '2026-01-01' AND p.criado_em < '2027-01-01'
      GROUP BY c.id, c.nome
      ORDER BY total DESC
      LIMIT 5;
      ```
    - |
      SELECT c.nome, SUM(p.total) AS valor_total
      FROM clientes c JOIN pedidos p ON p.cliente_id = c.id
      WHERE p.status = 'pago' AND EXTRACT(YEAR FROM p.criado_em) = 2026
      GROUP BY c.nome ORDER BY valor_total DESC LIMIT 5;
  fail:
    - "SELECT nome, total FROM clientes JOIN pedidos ON pedidos.cliente_id = clientes.id ORDER BY total DESC LIMIT 5"
    - "SELECT c.nome, SUM(p.total) AS total FROM clientes c JOIN pedidos p ON p.cliente_id = c.id WHERE p.status = 'pago' GROUP BY c.id, c.nome ORDER BY total DESC LIMIT 5"

