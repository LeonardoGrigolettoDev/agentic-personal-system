# LiteLLM model gateway - tiers from docs/ARCHITECTURE.md §13.
# This is the TEMPLATE. `make litellm-config` renders config.yaml with only the deployments whose
# provider key is set in .env, and prunes fallbacks pointing at groups that ended up empty.
# Model ids/prices verified 2026-10-07 (docs/research-litellm.md).
#
#   Tier 0  deterministic (hooks, git, tests)         - no LLM
#   Tier 1  decision: Jev / OpenAI Decisions / local  - Decision Service (not routed here, except decider-local)
#   Tier 2  cheap: classification, extraction, summary  -> tier2-cheap, tier2-flash, local-qwen
#   Tier 3  coding worker: Kimi K2.7 Code              -> tier3-code
#   Tier 4  strong: DeepSeek V4 Pro / Kimi K3          -> tier4-pro, tier4-k3
#   Tier 5  frontier efficient: Claude Sonnet          -> tier5-sonnet
#   Tier 6  frontier strong: Claude Opus               -> tier6-opus
#   Tier 7  last resort: Claude Fable (human-approved) -> tier7-fable

x-claude-drop: &claude-drop ["temperature", "top_p", "tool_choice"] # Claude 5.x 400s on these

model_list:
  # ── local (Ollama on the host, Vulkan) - $0. Never Hermes' main model (Hermes requires >=64K ctx) ──
  - model_name: local-qwen
    litellm_params: { model: ollama_chat/qwen3:4b-instruct-2507-q4_K_M, api_base: os.environ/OLLAMA_API_BASE, keep_alive: "5m", timeout: 300 }
    model_info: { input_cost_per_token: 0, output_cost_per_token: 0, max_input_tokens: 4096 }
  - model_name: decider-local
    litellm_params: { model: ollama_chat/qwen3:4b-instruct-2507-q4_K_M, api_base: os.environ/OLLAMA_API_BASE, temperature: 0, keep_alive: "5m", timeout: 120 }
    model_info: { input_cost_per_token: 0, output_cost_per_token: 0, max_input_tokens: 4096 }
  - model_name: embed-local # 1024 dims -> vector(1024) in migrations/004
    litellm_params: { model: ollama/qwen3-embedding:0.6b, api_base: os.environ/OLLAMA_API_BASE, timeout: 300 }
    model_info: { mode: embedding, input_cost_per_token: 0, output_cost_per_token: 0 }

  # ── Tier 2: cheap cloud ──
  - model_name: tier2-cheap # Qwen3.7 Flash $0.03/$0.13, 1M ctx
    litellm_params: { model: openrouter/qwen/qwen3.7-flash, api_key: os.environ/OPENROUTER_API_KEY, order: 1 }
  - model_name: tier2-flash # DeepSeek V4.1 Flash $0.30/$1.20 (half off-peak)
    litellm_params: { model: deepseek/deepseek-flash, api_key: os.environ/DEEPSEEK_API_KEY, order: 1 }
  - model_name: tier2-flash
    litellm_params: { model: openrouter/deepseek/deepseek-v4.1-flash, api_key: os.environ/OPENROUTER_API_KEY, order: 2 }

  # ── Tier 3: coding worker ──
  - model_name: tier3-code # Kimi K2.7 Code $0.95/$4, 262K ctx
    litellm_params: { model: moonshot/kimi-k2.7-code, api_key: os.environ/MOONSHOT_API_KEY, api_base: "https://api.moonshot.ai/v1", order: 1 }
  - model_name: tier3-code
    litellm_params: { model: openrouter/moonshotai/kimi-k2.7-code, api_key: os.environ/OPENROUTER_API_KEY, order: 2 }

  # ── Tier 4: strong ──
  - model_name: tier4-pro # DeepSeek V4 Pro $1.32/$3.96 peak, 1M ctx
    litellm_params: { model: deepseek/deepseek-v4-pro, api_key: os.environ/DEEPSEEK_API_KEY, order: 1 }
  - model_name: tier4-pro
    litellm_params: { model: openrouter/deepseek/deepseek-v4-pro-0813, api_key: os.environ/OPENROUTER_API_KEY, order: 2 }
  - model_name: tier4-k3 # Kimi K3 $3/$15, 1M ctx
    litellm_params: { model: moonshot/kimi-k3, api_key: os.environ/MOONSHOT_API_KEY, api_base: "https://api.moonshot.ai/v1", order: 1 }
  - model_name: tier4-k3
    litellm_params: { model: openrouter/moonshotai/kimi-k3, api_key: os.environ/OPENROUTER_API_KEY, order: 2 }

  # ── Tier 5: frontier efficient ──
  - model_name: tier5-sonnet # Claude Sonnet 5.5 $2/$10 - not in v1.104.0 bundled cost map -> explicit
    litellm_params: { model: anthropic/claude-sonnet-5-5, api_key: os.environ/ANTHROPIC_API_KEY, order: 1, additional_drop_params: *claude-drop }
    model_info: { input_cost_per_token: 0.000002, output_cost_per_token: 0.00001 }
  - model_name: tier5-sonnet
    litellm_params: { model: openrouter/anthropic/claude-sonnet-5.5, api_key: os.environ/OPENROUTER_API_KEY, order: 2, additional_drop_params: *claude-drop }
    model_info: { input_cost_per_token: 0.000002, output_cost_per_token: 0.00001 }

  # ── Tier 6: frontier strong ──
  - model_name: tier6-opus # Claude Opus 5.5 $4/$20
    litellm_params: { model: anthropic/claude-opus-5-5, api_key: os.environ/ANTHROPIC_API_KEY, order: 1, additional_drop_params: *claude-drop }
  - model_name: tier6-opus
    litellm_params: { model: openrouter/anthropic/claude-opus-5.5, api_key: os.environ/OPENROUTER_API_KEY, order: 2, additional_drop_params: *claude-drop }

  # ── Tier 7: last resort - only keys with explicit access (not Hermes' default key) ──
  - model_name: tier7-fable # Claude Fable 5.1 $10/$50
    litellm_params: { model: anthropic/claude-fable-5-1, api_key: os.environ/ANTHROPIC_API_KEY, order: 1, additional_drop_params: *claude-drop }
  - model_name: tier7-fable
    litellm_params: { model: openrouter/anthropic/claude-fable-5.1, api_key: os.environ/OPENROUTER_API_KEY, order: 2, additional_drop_params: *claude-drop }

litellm_settings:
  drop_params: true
  request_timeout: 600
  num_retries: 2
  cache: false # Phase 1: off (shared Valkey is noeviction for Langfuse); enable with TTLs later
  # callbacks: ["langfuse_otel"]   # `make litellm-config` enables this when LANGFUSE_PUBLIC_KEY is set
  max_budget: 50 # USD global hard cap per budget_duration
  budget_duration: 30d
  json_logs: true

router_settings:
  routing_strategy: simple-shuffle
  num_retries: 2
  timeout: 600
  allowed_fails: 3
  cooldown_time: 30
  enable_pre_call_checks: true
  retry_policy:
    RateLimitErrorRetries: 3
    TimeoutErrorRetries: 2
    InternalServerErrorRetries: 2
    AuthenticationErrorRetries: 0
    BadRequestErrorRetries: 0
    ContentPolicyViolationErrorRetries: 0
    DefaultRetries: 1
  # Escalation is the orchestrator's job (§7 escalation loop, by evidence). These fallbacks only cover
  # provider outages, so they mostly stay within the same or the next tier and never go to local-qwen.
  fallbacks:
    - { "tier2-cheap": ["tier2-flash"] }
    - { "tier2-flash": ["tier2-cheap"] }
    - { "tier3-code": ["tier4-pro"] }
    - { "tier4-pro": ["tier4-k3", "tier3-code"] }
    - { "tier4-k3": ["tier4-pro"] }
    - { "tier5-sonnet": ["tier4-k3"] }
    - { "tier6-opus": ["tier5-sonnet"] }
    - { "tier7-fable": ["tier6-opus"] }
    - { "decider-local": ["tier2-cheap"] }
  context_window_fallbacks:
    - { "local-qwen": ["tier2-cheap"] }
    - { "tier3-code": ["tier4-k3"] }

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  store_model_in_db: true
  store_prompts_in_spend_logs: true
  maximum_spend_logs_retention_period: "30d"
  maximum_spend_logs_retention_interval: "1d"
  proxy_batch_write_at: 60
  database_connection_pool_limit: 5
  allow_requests_on_db_unavailable: true
  disable_error_logs: true
