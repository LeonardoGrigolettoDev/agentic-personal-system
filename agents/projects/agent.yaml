# Agent definition (docs/ARCHITECTURE.md §4, §12). Hermes profile of the same name runs it; the Decision Service
# syncs it into agents/permissions (budget, max_tier) and the aios Hermes plugin enforces allowed_tools/tenants.
agent: projects
name: Projects
domain: projects
description: >-
  Empresa e projetos pessoais: roadmap, decisões, status, próximos passos.
default_model: tier2-flash
max_tier: 5   # escalation ceiling without human approval

allowed_tenants:
  - nitro
  - pessoal

allowed_domains:
  - projects
  - engineering

deny_domains:
  - finance

allowed_tools:   # categories: shell filesystem knowledge web_research delegate tasks messaging mcp
  - filesystem
  - knowledge
  - web_research
  - tasks

max_cost_per_run: 0.30
token_budget:
  total: 30000
  decision: 1000
  retrieval: 3000
  execution: 20000
  final: 6000
max_iterations: 8
