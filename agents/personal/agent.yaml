# Agent definition (docs/ARCHITECTURE.md §4, §12). Hermes profile of the same name runs it; the Decision Service
# syncs it into agents/permissions (budget, max_tier) and the aios Hermes plugin enforces allowed_tools/tenants.
agent: personal
name: Personal
domain: personal
description: >-
  Organização pessoal: agenda, rotinas, revisões diárias e semanais.
default_model: tier2-cheap
max_tier: 4   # escalation ceiling without human approval

allowed_tenants:
  - pessoal

allowed_domains:
  - personal

deny_domains:
  - engineering
  - finance

allowed_tools:   # categories: shell filesystem knowledge web_research delegate tasks messaging mcp
  - knowledge
  - tasks
  - messaging

max_cost_per_run: 0.10
token_budget:
  total: 30000
  decision: 1000
  retrieval: 3000
  execution: 20000
  final: 6000
max_iterations: 8
