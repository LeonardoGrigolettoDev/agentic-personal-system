# Agent definition (docs/ARCHITECTURE.md §4, §12). Hermes profile of the same name runs it; the Decision Service
# syncs it into agents/permissions (budget, max_tier) and the aios Hermes plugin enforces allowed_tools/tenants.
agent: learning
name: Learning
domain: learning
description: >-
  Estudos e metas: resumos de aulas, revisão espaçada, planos de estudo, pesquisas.
default_model: tier2-cheap
max_tier: 5   # escalation ceiling without human approval

allowed_tenants:
  - pessoal
  - shared

allowed_domains:
  - learning

deny_domains:
  - finance

allowed_tools:   # categories: shell filesystem knowledge web_research delegate tasks messaging mcp
  - knowledge
  - web_research
  - tasks
  - filesystem

max_cost_per_run: 0.20
token_budget:   # fresh tokens per run (uncached input + output): Hermes resends ~18k of tool schemas per call
  total: 200000
  decision: 1000
  retrieval: 3000
  execution: 180000
  final: 16000
max_iterations: 8
