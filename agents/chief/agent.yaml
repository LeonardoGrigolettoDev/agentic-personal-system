# Agent definition (docs/ARCHITECTURE.md §4, §12). Hermes profile of the same name runs it; the Decision Service
# syncs it into agents/permissions (budget, max_tier) and the aios Hermes plugin enforces allowed_tools/tenants.
agent: chief
name: Chief / Orchestrator
domain: chief
description: >-
  Coordena tarefas cruzadas: agenda → tarefas → projetos → estudos → delegação → consolidação → resposta.
default_model: tier3-code
max_tier: 6   # escalation ceiling without human approval

allowed_tenants:
  - nitro
  - pessoal
  - shared

allowed_domains:
  - engineering
  - finance
  - projects
  - personal
  - learning

deny_domains: []

allowed_tools:   # categories: shell filesystem knowledge web_research delegate tasks messaging mcp
  - knowledge
  - delegate
  - tasks
  - web_research
  - messaging

max_cost_per_run: 0.50
token_budget:
  total: 30000
  decision: 1000
  retrieval: 3000
  execution: 20000
  final: 6000
max_iterations: 8
