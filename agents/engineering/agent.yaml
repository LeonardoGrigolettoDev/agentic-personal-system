# Agent definition (docs/ARCHITECTURE.md §4, §12). Hermes profile of the same name runs it; the Decision Service
# syncs it into agents/permissions (budget, max_tier) and the aios Hermes plugin enforces allowed_tools/tenants.
agent: engineering
name: Engineering
domain: engineering
description: >-
  Programação: análise de repositório, implementação, debugging, code review, testes. Projetos (trabalho, mini-ERP, visão computacional...) são contexto.
default_model: tier3-code
max_tier: 6   # escalation ceiling without human approval

allowed_tenants:
  - nitro
  - pessoal

allowed_domains:
  - engineering
  - projects

deny_domains:
  - finance
  - personal

allowed_tools:   # categories: shell filesystem knowledge web_research delegate tasks messaging mcp
  - shell
  - filesystem
  - knowledge
  - web_research
  - delegate
  - tasks
  - mcp

max_cost_per_run: 0.50
token_budget:   # fresh tokens per run (uncached input + output): Hermes resends ~18k of tool schemas per call
  total: 400000
  decision: 1000
  retrieval: 3000
  execution: 380000
  final: 16000
max_iterations: 8
