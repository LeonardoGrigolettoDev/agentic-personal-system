# Agent definition (docs/ARCHITECTURE.md §4, §12). Seeded into the `agents`/`permissions` tables in Phase 2.
agent: engineering
name: Engineering
domain: engineering
description: >-
  Programação: análise de repositório, implementação, debugging, code review, testes. Projetos (trabalho, mini-ERP, visão computacional...) são contexto.
default_model: tier3-code
max_tier: 6   # escalation ceiling without human approval

allowed_tenants:
  - nitro
  - pessoal

allowed_domains:
  - engineering
  - projects

deny_domains:
  - finance
  - personal

allowed_tools:
  - github
  - filesystem
  - shell
  - docker
  - knowledge_search

max_cost_per_run: 0.50
token_budget:
  total: 30000
  decision: 1000
  retrieval: 3000
  execution: 20000
  final: 6000
max_iterations: 8
